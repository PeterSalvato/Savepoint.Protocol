<!-- The canonical tag set large. Each field is a button that marks its row in the field table that follows,
     so the definitions live in one place. Without script, the tag reads as the canonical format. -->
<div class="specimen">
  <p class="hint">Select a field to find it in the field specification.</p>
  <div class="spec">
    <div class="tag" id="specimen-tag">
      <span class="t">&lt;Savepoint</span>
      <button type="button" aria-pressed="false"><span class="k">protocol_version:</span><span class="v">3.2</span></button>
      <button type="button" aria-pressed="false"><span class="k">category:</span><span class="v">[domain_context]</span></button>
      <button type="button" aria-pressed="false"><span class="k">function:</span><span class="v">[role or purpose]</span></button>
      <button type="button" aria-pressed="false"><span class="k">timestamp:</span><span class="v">[ISO 8601 format]</span></button>
      <button type="button" aria-pressed="false"><span class="k">project:</span><span class="v">[project scope]</span></button>
      <button type="button" aria-pressed="false"><span class="k">keywords:</span><span class="v">[comma-separated terms]</span></button>
      <button type="button" aria-pressed="false"><span class="k">context:</span><span class="v">[reconstruction payload]</span></button>
      <button type="button" aria-pressed="false"><span class="k">importance:</span><span class="v">[optional]</span></button>
      <button type="button" aria-pressed="false"><span class="k">confidence:</span><span class="v">[optional]</span></button>
      <button type="button" aria-pressed="false"><span class="k">influence:</span><span class="v">[optional]</span></button>
      <button type="button" aria-pressed="false" data-name="# line"><span class="k"># </span><span class="v">[semantic content of the Savepoint]</span></button>
      <span class="t">/&gt;</span>
    </div>
</div>
</div>
<script>
  (function () {
    var tag = document.getElementById('specimen-tag');
    var buttons = tag.querySelectorAll('button');
    var table = tag.closest('.specimen').parentNode.querySelector('table');
    if (!table) return;
    var rows = {};
    table.querySelectorAll('tbody tr').forEach(function (tr) {
      rows[tr.cells[0].textContent.replace(/\s+line$/, '').trim()] = tr;
    });
    function nameOf(b) { return b.querySelector('.k').textContent.replace(':', '').trim(); }
    function mark(b) {
      buttons.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      Object.keys(rows).forEach(function (k) { rows[k].classList.toggle('on', b && k === nameOf(b)); });
    }
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        mark(b);
        var row = rows[nameOf(b)];
        if (row && row.getBoundingClientRect().bottom > window.innerHeight) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
    });
    Object.keys(rows).forEach(function (k) {
      var b = Array.prototype.find.call(buttons, function (x) { return nameOf(x) === k; });
      if (!b) return;
      rows[k].addEventListener('mouseenter', function () { mark(b); });
    });
  })();
</script>
